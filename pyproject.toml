[project]
name = "laser-trim"
version = "0.1.0"
description = "用贝叶斯优化调试激光调阻的频率和调阻速度"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "bayes-optim",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "torch>=2.0.1",
]

[tool.uv]
package = false  # 这是一个脚本工具，不需要打包安装

[tool.uv.sources]
# 修复过若干 bug 的 bayes-optim：用 LesterZoeyXu/BayesianOp 的 37b418e 预先构建的 wheel，
# 安装时不需要构建（避免 Windows 上的构建问题），也不需要 BayesianOp 仓库的访问权限
bayes-optim = { path = "wheels/bayes_optim-0.3.0-py3-none-any.whl" }
# torch 只用 CPU 版，比默认的 CUDA 版小几 GB
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
